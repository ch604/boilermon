# Board: Generic ESP32-S2 Board (Generic)
# Definition: definitions/boards/generic-esp32s2/manifest.yaml

esphome:
  name: boilermon
  friendly_name: Boiler Monitor

esp32:
  variant: esp32s2
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret boilermon__api_key

ota:
  - platform: esphome
    password: !secret boilermon__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: boilermon Fallback Hotspot
    password: !secret boilermon__ap_password

captive_portal:

mdns:

time:
  platform: homeassistant

one_wire:
  - platform: gpio
    pin: GPIO13

i2c:
  - scl: GPIO9
    sda: GPIO8
    
sensor:
  - platform: dallas_temp
    id: boiler_inlet
    icon: "mdi:thermometer-low"
  - platform: dallas_temp
    id: boiler_outlet
    icon: "mdi:thermometer-high"
  - platform: dallas_temp
    id: boiler_exhaust
    icon: "mdi:location-exit"
  - platform: dallas_temp
    id: dhw_tank
    icon: "mdi:water-thermometer"
  - platform: dallas_temp
    id: heating_loop
    icon: "mdi:heating-coil"
  - platform: dallas_temp
    id: ambient
    icon: "mdi:thermometer-auto"

  - platform: adc
    pin: GPIO1
    id: boiler_pump
    icon: "mdi:water-boiler"
  - platform: adc
    pin: GPIO2
    id: circ_pump
    icon: "mdi:restart"
  - platform: adc
    pin: GPIO3
    id: dhw_pump
    icon: "mdi:water-pump"

  - platform: wifi_signal
    name: "RSSI"
    icon: "mdi:wifi-arrow-up-down"

  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: gpio
    pin: GPIO39
    id: zone_1
    icon: "mdi:format-header1"
  - platform: gpio
    pin: GPIO40
    id: zone_2
    icon: "mdi:format-header2"
  - platform: gpio
    pin: GPIO41
    id: zone_3
    icon: "mdi:format-header3"
  - platform: gpio
    pin: GPIO42
    id: zone_4
    icon: "mdi:format-header4"

display:
  - platform: lcd_pcf8574
    dimensions: 16x2
    id: display_lcd_pcf8574_16x2

button:
  - platform: restart
    name: "Restart"
    entity_category: "diagnostic"
    icon: "mdi:restart-alert"
